services:
  pocket-timelapse:
    container_name: pocket-timelapse

    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    image: layer42/pocket-timelapse:cu128

    gpus: all
    shm_size: "16gb"
    mem_limit: 48g
    pids_limit: 4096

    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true

    volumes:
      - .:/workspace/pocket-timelapse