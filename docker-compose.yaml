services:
  pocket-timelapse:
    container_name: pocket-timelapse

    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    image: layer42/pocket-timelapse:cu128

    gpus: all
    shm_size: "8gb"

    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - .:/workspace/pocket-timelapse
