
services:
  pocket-timelapse:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: pocket-timelapse
        UID: 1000
        GID: 1000

    image: layer42/pocket-timelapse:cu128
    container_name: pocket-timelapse

    gpus: all
    shm_size: "8gb"

    environment:
      TORCH_CUDA_ARCH_LIST: "7.5;8.0;8.6+PTX"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    volumes:
      - .:/workspace/pocket-timelapse

    working_dir: /workspace/pocket-timelapse

    stdin_open: true
    tty: true
    command: /bin/bash
